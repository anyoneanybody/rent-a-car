<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>좌표 측정</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic',sans-serif;background:#888;}

/* index.html과 완전히 동일한 topbar */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:#1a1a2e;display:flex;align-items:center;height:50px;
}
.topbar span{color:#fff;padding:0 16px;font-size:14px;}
.btns{margin-left:auto;display:flex;gap:6px;padding-right:10px;}
.btns button{
  border:none;border-radius:6px;
  padding:7px 12px;font-size:12px;cursor:pointer;color:#fff;
}
.btn-toggle{background:#8e44ad;}
.btn-clear{background:#e74c3c;}

/* index.html과 완전히 동일한 fw */
.pages{margin-top:50px;}
.fw{
  position:relative;
  width:100%;
  max-width:650px;
  margin:0 auto;
  cursor:crosshair;
}
.fw img.bg{width:100%;display:block;pointer-events:none;}
.ov{position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;}

.dbox{
  position:absolute;
  border:2px solid #f39c12;
  background:rgba(243,156,18,0.25);
  pointer-events:none;
  z-index:20;
}
.dlabel{
  position:absolute;
  background:#f39c12;color:#000;
  font-size:12px;font-weight:bold;
  padding:1px 5px;
  pointer-events:none;
  z-index:21;
}

/* 결과 */
.result{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#111;color:#2ecc71;
  padding:10px 14px;font-size:12px;
  max-height:130px;overflow-y:auto;
  font-family:monospace;white-space:pre;
}
</style>
</head>
<body>

<div class="topbar">
  <span>📐 사진 칸을 마우스로 드래그하세요</span>
  <div class="btns">
    <button class="btn-toggle" onclick="toggleImg()">form1 ↔ form2</button>
    <button class="btn-clear" onclick="clearAll()">🗑️ 초기화</button>
  </div>
</div>

<div class="pages">
  <div class="fw" id="fw"
    onmousedown="startDrag(event)"
    onmousemove="moveDrag(event)"
    onmouseup="endDrag(event)">
    <img class="bg" src="form1.jpg" id="bgImg">
    <div class="ov" id="ov"></div>
  </div>
</div>

<div class="result" id="result">여기에 좌표가 표시됩니다...</div>

<script>
let dragging=false;
let startX,startY;
let curBox=null;
let boxes=[];
let currentForm=1;

const fw=document.getElementById('fw');
const ov=document.getElementById('ov');
const result=document.getElementById('result');

function getPos(e){
  const rect=fw.getBoundingClientRect();
  return{x:e.clientX-rect.left, y:e.clientY-rect.top};
}

function startDrag(e){
  if(e.target.classList.contains('dbox')||e.target.classList.contains('dlabel'))return;
  e.preventDefault();
  const p=getPos(e);
  startX=p.x;startY=p.y;
  dragging=true;
  curBox=document.createElement('div');
  curBox.className='dbox';
  curBox.style.cssText=`left:${startX}px;top:${startY}px;width:0;height:0;`;
  ov.appendChild(curBox);
}

function moveDrag(e){
  if(!dragging||!curBox)return;
  e.preventDefault();
  const p=getPos(e);
  const x=Math.min(startX,p.x);
  const y=Math.min(startY,p.y);
  const w=Math.abs(p.x-startX);
  const h=Math.abs(p.y-startY);
  curBox.style.left=x+'px';
  curBox.style.top=y+'px';
  curBox.style.width=w+'px';
  curBox.style.height=h+'px';
}

function endDrag(e){
  if(!dragging||!curBox)return;
  dragging=false;
  const p=getPos(e);
  const W=fw.clientWidth;
  const H=fw.clientHeight;
  const x=Math.min(startX,p.x);
  const y=Math.min(startY,p.y);
  const w=Math.abs(p.x-startX);
  const h=Math.abs(p.y-startY);

  if(w<10||h<10){curBox.remove();curBox=null;return;}

  const tp=(y/H*100).toFixed(1);
  const lp=(x/W*100).toFixed(1);
  const wp=(w/W*100).toFixed(1);
  const hp=(h/H*100).toFixed(1);

  boxes.push({tp,lp,wp,hp,form:currentForm});

  const label=document.createElement('div');
  label.className='dlabel';
  label.style.left=x+'px';
  label.style.top=y+'px';
  label.textContent=boxes.length;
  ov.appendChild(label);

  curBox=null;
  updateResult();
}

function updateResult(){
  let txt='📋 측정 결과:\n\n';
  boxes.forEach((b,i)=>{
    txt+=`박스${i+1}(form${b.form}): t=${b.tp}%, l=${b.lp}%, w=${b.wp}%, h=${b.hp}%\n`;
  });
  result.textContent=txt;
}

function clearAll(){
  boxes=[];
  ov.innerHTML='';
  result.textContent='여기에 좌표가 표시됩니다...';
}

function toggleImg(){
  const img=document.getElementById('bgImg');
  if(currentForm===1){
    img.src='form2.jpg';
    currentForm=2;
  }else{
    img.src='form1.jpg';
    currentForm=1;
  }
  clearAll();
}
</script>
</body>
</html>
