<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>좌표 측정</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic',sans-serif;background:#333;}
.info{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:#1a1a2e;color:#fff;
  padding:10px 14px;font-size:13px;line-height:1.7;
}
.info b{color:#f39c12;}
.clear-btn{
  position:fixed;top:10px;right:10px;z-index:200;
  background:#e74c3c;color:#fff;border:none;
  padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;
}
.toggle-btn{
  position:fixed;top:10px;right:90px;z-index:200;
  background:#8e44ad;color:#fff;border:none;
  padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;
}
.result{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#111;color:#2ecc71;
  padding:10px 14px;font-size:12px;
  max-height:160px;overflow-y:auto;
  font-family:monospace;white-space:pre;
}
.fw{
  position:relative;
  width:100%;
  max-width:650px;
  margin:70px auto 170px;
  cursor:crosshair;
}
.fw img{width:100%;display:block;pointer-events:none;}
.dbox{
  position:absolute;
  border:2px solid #f39c12;
  background:rgba(243,156,18,0.25);
  pointer-events:none;
  z-index:10;
}
.dlabel{
  position:absolute;
  background:#f39c12;color:#000;
  font-size:12px;font-weight:bold;
  padding:1px 5px;
  pointer-events:none;
  z-index:11;
}
</style>
</head>
<body>

<div class="info">
  📐 <b>사진 칸 좌표 측정</b> — 사진이 들어갈 빈 칸을 마우스로 드래그하세요.<br>
  측정 후 아래 좌표를 복사해서 Claude에게 전달하세요.
</div>
<button class="toggle-btn" onclick="toggleImg()">form1 ↔ form2</button>
<button class="clear-btn" onclick="clearAll()">🗑️ 초기화</button>

<div class="fw" id="fw"
  onmousedown="startDrag(event)"
  onmousemove="moveDrag(event)"
  onmouseup="endDrag(event)">
  <img src="form1.jpg" id="bgImg">
</div>

<div class="result" id="result">여기에 좌표가 표시됩니다...</div>

<script>
let dragging=false;
let startX,startY;
let curBox=null;
let boxes=[];
let currentForm=1;

const fw=document.getElementById('fw');
const result=document.getElementById('result');

function getPos(e){
  const rect=fw.getBoundingClientRect();
  return{x:e.clientX-rect.left, y:e.clientY-rect.top};
}

function startDrag(e){
  e.preventDefault();
  const p=getPos(e);
  startX=p.x;startY=p.y;
  dragging=true;
  curBox=document.createElement('div');
  curBox.className='dbox';
  curBox.style.cssText=`left:${startX}px;top:${startY}px;width:0;height:0;`;
  fw.appendChild(curBox);
}

function moveDrag(e){
  if(!dragging||!curBox)return;
  const p=getPos(e);
  const x=Math.min(startX,p.x);
  const y=Math.min(startY,p.y);
  const w=Math.abs(p.x-startX);
  const h=Math.abs(p.y-startY);
  curBox.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;border:2px solid #f39c12;background:rgba(243,156,18,0.25);position:absolute;pointer-events:none;z-index:10;`;
}

function endDrag(e){
  if(!dragging||!curBox)return;
  dragging=false;
  const p=getPos(e);
  const W=fw.clientWidth;
  const H=fw.clientHeight;
  const x=Math.min(startX,p.x);
  const y=Math.min(startY,p.y);
  const w=Math.abs(p.x-startX);
  const h=Math.abs(p.y-startY);

  if(w<10||h<10){curBox.remove();curBox=null;return;}

  const tp=(y/H*100).toFixed(1);
  const lp=(x/W*100).toFixed(1);
  const wp=(w/W*100).toFixed(1);
  const hp=(h/H*100).toFixed(1);

  boxes.push({tp,lp,wp,hp,form:currentForm});

  const label=document.createElement('div');
  label.className='dlabel';
  label.style.cssText=`left:${x}px;top:${y}px;`;
  label.textContent=boxes.length;
  fw.appendChild(label);

  curBox=null;
  updateResult();
}

function updateResult(){
  let txt='📋 측정 결과 (Claude에게 전달):\n\n';
  boxes.forEach((b,i)=>{
    txt+=`박스${i+1}(form${b.form}): t=${b.tp}%, l=${b.lp}%, w=${b.wp}%, h=${b.hp}%\n`;
  });
  result.textContent=txt;
}

function clearAll(){
  boxes=[];
  // 박스와 라벨만 제거
  fw.querySelectorAll('.dbox,.dlabel').forEach(el=>el.remove());
  result.textContent='여기에 좌표가 표시됩니다...';
}

function toggleImg(){
  const img=document.getElementById('bgImg');
  if(currentForm===1){
    img.src='form2.jpg';
    currentForm=2;
  } else {
    img.src='form1.jpg';
    currentForm=1;
  }
}
</script>
</body>
</html>
